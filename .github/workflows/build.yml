name: Build MyDownloader APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Core Architecture
        run: |
          git clone https://github.com .
          chmod +x gradlew

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App Target
        run: |
          ./gradlew assembleDebug

      - name: Export Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydownloader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
