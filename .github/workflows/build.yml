name: Build MyDownloader APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Standard Android Source
        run: |
          git clone --depth=1 https://github.com .

      - name: Setup Gradle Framework Tools
        uses: gradle/actions/setup-gradle@v3

      - name: Compile and Assemble Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Export Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mydownloader-apk
          path: "**/build/outputs/apk/debug/*.apk"
