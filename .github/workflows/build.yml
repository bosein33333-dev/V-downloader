name: Build MyDownloader APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle -v

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/mm/mydownloader app/src/main/res/values

          # 1. settings.gradle
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'MyDownloader'" >> settings.gradle
          echo "include ':app'" >> settings.gradle

          # 2. build.gradle (Root)
          echo "plugins { id 'com.android.application' version '8.1.1' apply false; id 'org.jetbrains.kotlin.android' version '1.8.22' apply false }" > build.gradle

          # 3. app/build.gradle
          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" > app/build.gradle
          echo "android { namespace 'com.mm.mydownloader'; compileSdk 34; defaultConfig { applicationId 'com.mm.mydownloader'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.core:core-ktx:1.10.1'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.gms:play-services-ads:22.2.0' }" >> app/build.gradle

          # 4. Resources
          echo '<resources><string name="app_name">V-Downloader</string></resources>' > app/src/main/res/values/strings.xml
          echo '<resources><style name="Theme.MyDownloader" parent="Theme.AppCompat.Light.NoActionBar"/></resources>' > app/src/main/res/values/themes.xml

          # 5. AndroidManifest.xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' >> app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.INTERNET"/>' >> app/src/main/AndroidManifest.xml
          echo '    <application android:name=".App" android:label="@string/app_name" android:theme="@style/Theme.MyDownloader">' >> app/src/main/AndroidManifest.xml
          echo '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' >> app/src/main/AndroidManifest.xml
          echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN"/>' >> app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER"/>' >> app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '        </activity>' >> app/src/main/AndroidManifest.xml
          echo '    </application>' >> app/src/main/AndroidManifest.xml
          echo '</manifest>' >> app/src/main/AndroidManifest.xml

          # 6. App.kt
          echo 'package com.mm.mydownloader' > app/src/main/java/com/mm/mydownloader/App.kt
          echo 'import android.app.Application' >> app/src/main/java/com/mm/mydownloader/App.kt
          echo 'import com.google.android.gms.ads.MobileAds' >> app/src/main/java/com/mm/mydownloader/App.kt
          echo 'class App : Application() { override fun onCreate() { super.onCreate(); MobileAds.initialize(this) {} } }' >> app/src/main/java/com/mm/mydownloader/App.kt

          # 7. MainActivity.kt
          echo 'package com.mm.mydownloader' > app/src/main/java/com/mm/mydownloader/MainActivity.kt
          echo 'import android.os.Bundle' >> app/src/main/java/com/mm/mydownloader/MainActivity.kt
          echo 'import android.webkit.WebView' >> app/src/main/java/com/mm/mydownloader/MainActivity.kt
          echo 'import android.webkit.WebViewClient' >> app/src/main/java/com/mm/mydownloader/MainActivity.kt
          echo 'import android.widget.LinearLayout' >> app/src/main/java/com/mm/mydownloader/MainActivity.kt
          echo 'import androidx.appcompat.app.AppCompatActivity' >> app/src/main/java/com/mm/mydownloader/MainActivity.kt
          echo 'import com.google.android.gms.ads.AdRequest' >> app/src/main/java/com/mm/mydownloader/MainActivity.kt
          echo 'import com.google.android.gms.ads.AdView' >> app/src/main/java/com/mm/mydownloader/MainActivity.kt
          echo 'class MainActivity : AppCompatActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }; val webView = WebView(this).apply { settings.javaScriptEnabled = true; webViewClient = WebViewClient() }; val adView = AdView(this).apply { setAdSize(com.google.android.gms.ads.AdSize.BANNER); adUnitId = "ca-app-pub-3940256099942544/6300978111" }; root.addView(webView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)); root.addView(adView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)); setContentView(root); adView.loadAd(AdRequest.Builder().build()); webView.loadUrl("https://google.com") } }' >> app/src/main/java/com/mm/mydownloader/MainActivity.kt

      - name: Generate Local Wrapper
        run: |
          gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew

      - name: Compile and Build APK
        run: ./gradlew assembleDebug

      - name: Extract APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydownloader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
