name: Build MyDownloader APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Pre-Generate Android Project Architecture
        run: |
          mkdir -p app/src/main/java/com/mm/mydownloader
          mkdir -p app/src/main/res/values

      - name: Create Settings Gradle Config
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "MyDownloader"
          include ':app'
          EOF

      - name: Create Root Build Gradle Config
        run: |
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
          }
          EOF

      - name: Create App Build Gradle Config
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.mm.mydownloader'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mm.mydownloader"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
              }
              packagingOptions { jniLibs { useLegacyPackaging = true } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.gms:play-services-ads:22.2.0'
              implementation 'com.github.yausername.youtubedl-android:library:0.15.0'
              implementation 'com.github.yausername.youtubedl-android:ffmpeg:0.15.0'
          }
          EOF

      - name: Create Android Resources Config
        run: |
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">V-Downloader</string></resources>
          EOF
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources><style name="Theme.MyDownloader" parent="Theme.AppCompat.Light.NoActionBar"/></resources>
          EOF

      - name: Create Android Application Manifest Config
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application
                  android:name=".App"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:extractNativeLibs="true"
                  android:theme="@style/Theme.MyDownloader">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Application Core Downloader Class
        run: |
          cat << 'EOF' > app/src/main/java/com/mm/mydownloader/App.kt
          package com.mm.mydownloader
          import android.app.Application
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.google.android.gms.ads.MobileAds
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch

          object EngineState { @Volatile var ready = false }

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  MobileAds.initialize(this) {}
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          EngineState.ready = true
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }
          }
          EOF

      - name: Create Main Target Window Browser UI
        run: |
          cat << 'EOF' > app/src/main/java/com/mm/mydownloader/MainActivity.kt
          package com.mm.mydownloader
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.AdView

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate()
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      webViewClient = WebViewClient()
                  }
                  val adView = AdView(this).apply {
                      setAdSize(com.google.android.gms.ads.AdSize.BANNER)
                      adUnitId = "ca-app-pub-3940256099942544/6300978111"
                  }
                  root.addView(webView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  root.addView(adView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  setContentView(root)
                  adView.loadAd(AdRequest.Builder().build())
                  webView.loadUrl("https://google.com")
                  Toast.makeText(this, "Welcome to V-Downloader Tool Engine", Toast.LENGTH_LONG).show()
              }
          }
          EOF

      - name: Setup Gradle Toolkit build
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Create Local Build Wrapper Environment
        run: |
          gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew

      - name: Build and Package target Android APK
        run: |
          ./gradlew assembleDebug

      - name: Upload and Publish Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydownloader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
